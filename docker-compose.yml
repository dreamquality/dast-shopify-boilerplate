services:
  security-proxy:
    image: owasp/zap2docker-stable
    command: ["zap.sh", "-daemon", "-host", "0.0.0.0", "-port", "8080", "-config", "api.disablekey=true"]
    ports:
      - "127.0.0.1:8080:8080"

  qa-runner:
    build:
      context: .
    depends_on:
      - security-proxy
    environment:
      HTTP_PROXY: http://security-proxy:8080
      HTTPS_PROXY: http://security-proxy:8080
    volumes:
      - ./allure-results:/app/allure-results
      - ./.ai-cache:/app/.ai-cache
